# Example Secret template — do NOT commit real credentials.
# Replace the placeholder JSON with your actual service-account credentials,
# then apply with: kubectl apply -f secret-google-creds.yaml -n readership-map
apiVersion: v1
kind: Secret
metadata:
  name: readership-map-google-creds
  namespace: readership-map
type: Opaque
stringData:
  credentials.json: |
    {
      "type": "service_account",
      "project_id": "REPLACE_ME",
      "private_key_id": "REPLACE_ME",
      "private_key": "REPLACE_ME",
      "client_email": "REPLACE_ME@REPLACE_ME.iam.gserviceaccount.com",
      "client_id": "REPLACE_ME",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token"
    }
